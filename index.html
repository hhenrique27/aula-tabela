<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabela</title>
    <style>
        th, td {
            border: 1px solid black;
        }

        tfoot, th {
            background-color: yellow;
        }
    </style>


  </head>
  <body>
    <h1>Tabela</h1>

    <table>
      <thead>
        <tr>
          <th>Produto</th>
          <th>Quantidade</th>
          <th>Valor</th>
          <th>Black friday</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Produto 1</td>
          <td>2</td>
          <td>8$</td>
          <td>Sim</td>
        </tr>
      </tbody>

      <tbody>
        <tr>
          <td>Produto 2</td>
          <td>5</td>
          <td>12$</td>
          <td>Sim</td>
        </tr>
      </tbody>

      <tbody>
        <tr>
          <td>Produto 3</td>
          <td>1</td>
          <td>15$</td>
          <td>Não</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
            <td colspan="3">Total</td>
            <td>30$</td>
        </tr>
      </tfoot>

    </table>
  </body>
</html>
